# Optional overlay. The host path must already exist and be mounted by the deployer.
services:
  reelnest:
    environment:
      MEDIA_ROOTS: /media
    volumes:
      - type: bind
        source: ${MEDIA_HOST_PATH:?Set MEDIA_HOST_PATH to an existing absolute host directory}
        target: /media
        read_only: true
        bind:
          create_host_path: false
