# Legacy one-time migration only. New deployments use /settings/metadata.
# Remove this override after confirming imported settings; later env changes are ignored.
# Optional: enable with -f compose.yaml -f compose.tmdb.yaml.
services:
  reelnest:
    environment:
      TMDB_READ_ACCESS_TOKEN_FILE: /run/secrets/tmdb_read_access_token
    secrets:
      - tmdb_read_access_token
secrets:
  tmdb_read_access_token:
    file: ./secrets/tmdb_read_access_token.txt
