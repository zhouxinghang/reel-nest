services:
  reelnest:
    build: .
    ports:
      - "${HOST_BIND:-0.0.0.0}:${HOST_PORT:-8090}:8090"
    environment:
      DATA_DIR: /data
      LISTEN_ADDR: :8090
      HOUSEHOLD_USERNAME: ${HOUSEHOLD_USERNAME:-family}
      HOUSEHOLD_PASSWORD_FILE: /run/secrets/household_password
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    secrets:
      - household_password
    volumes:
      - app_data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 20s
secrets:
  household_password:
    file: ./secrets/household_password.txt
volumes:
  app_data:
