# Optional: combine with compose.yaml and optionally compose.tmdb.yaml.
services:
  reelnest:
    environment:
      TVDB_API_KEY_FILE: /run/secrets/tvdb_api_key
      # Only user-supported API keys require the subscriber PIN.
      TVDB_PIN: ${TVDB_PIN:-}
    secrets:
      - tvdb_api_key
secrets:
  tvdb_api_key:
    file: ./secrets/tvdb_api_key.txt
