  /api/media/{id}/content:
    get:
      operationId: mediaContent
      tags:
        - R10
      description: >-
        Verify file/parent identity then stream from the same handle, no transcoding or whole-file
        buffering.
      x-requirements:
        - R10
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ID"
        - name: Range
          in: header
          schema:
            type: string
            maxLength: 1024
        - name: If-Range
          in: header
          schema:
            type: string
            maxLength: 256
      responses:
        "200":
          description: Content
          content:
            video/*:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
          headers:
            Content-Type:
              schema:
                type: string
                maxLength: 128
            Content-Length:
              schema:
                type: integer
                minimum: 0
                maximum: 9007199254740991
            ETag:
              schema:
                type: string
                maxLength: 256
            Accept-Ranges:
              schema:
                type: string
                enum:
                  - bytes
        "206":
          description: Single or multipart byte range
          content:
            video/*:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
            multipart/byteranges:
              schema:
                type: string
                format: binary
          headers:
            Content-Range:
              schema:
                type: string
                maxLength: 256
        "416":
          description: Unsatisfiable or malformed range; standard HTTP text permitted
          content:
            text/plain:
              schema:
                type: string
                maxLength: 4096
          headers:
            Content-Range:
              schema:
                type: string
                maxLength: 256
        default:
          $ref: "#/components/responses/Error"
    head:
      operationId: mediaContentHead
      tags:
        - R10
      description: >-
        Verify file/parent identity then stream from the same handle, no transcoding or whole-file
        buffering.
      x-requirements:
        - R10
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ID"
        - name: Range
          in: header
          schema:
            type: string
            maxLength: 1024
        - name: If-Range
          in: header
          schema:
            type: string
            maxLength: 256
      responses:
        "200":
          description: Same headers, no body
          headers:
            Content-Type:
              schema:
                type: string
                maxLength: 128
            Content-Length:
              schema:
                type: integer
                minimum: 0
                maximum: 9007199254740991
            ETag:
              schema:
                type: string
                maxLength: 256
            Accept-Ranges:
              schema:
                type: string
                enum:
                  - bytes
        "206":
          description: Single or multipart byte range
          headers:
            Content-Range:
              schema:
                type: string
                maxLength: 256
        "416":
          description: Unsatisfiable or malformed range; standard HTTP text permitted
          content:
            text/plain:
              schema:
                type: string
                maxLength: 4096
          headers:
            Content-Range:
              schema:
                type: string
                maxLength: 256
        default:
          $ref: "#/components/responses/Error"
  /stream/{id}:
    get:
      operationId: streamContent
      tags:
        - R11
      description: >-
        Only token grants access to this file; Cookie never substitutes. No expiration, no progress
        writes.
      x-requirements:
        - R11
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ID"
        - name: token
          in: query
          required: true
          schema:
            type: string
            pattern: ^[a-f0-9]{64}$
            minLength: 64
            maxLength: 64
        - name: Range
          in: header
          schema:
            type: string
            maxLength: 1024
        - name: If-Range
          in: header
          schema:
            type: string
            maxLength: 256
      responses:
        "200":
          description: Content
          content:
            video/*:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
          headers:
            Content-Type:
              schema:
                type: string
                maxLength: 128
            Content-Length:
              schema:
                type: integer
                minimum: 0
                maximum: 9007199254740991
            ETag:
              schema:
                type: string
                maxLength: 256
            Accept-Ranges:
              schema:
                type: string
                enum:
                  - bytes
        "206":
          description: Single or multipart byte range
          content:
            video/*:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
            multipart/byteranges:
              schema:
                type: string
                format: binary
          headers:
            Content-Range:
              schema:
                type: string
                maxLength: 256
        "416":
          description: Unsatisfiable or malformed range; standard HTTP text permitted
          content:
            text/plain:
              schema:
                type: string
                maxLength: 4096
          headers:
            Content-Range:
              schema:
                type: string
                maxLength: 256
        default:
          $ref: "#/components/responses/Error"
      security:
        - streamToken: []
    head:
      operationId: streamContentHead
      tags:
        - R11
      description: >-
        Only token grants access to this file; Cookie never substitutes. No expiration, no progress
        writes.
      x-requirements:
        - R11
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ID"
        - name: token
          in: query
          required: true
          schema:
            type: string
            pattern: ^[a-f0-9]{64}$
            minLength: 64
            maxLength: 64
        - name: Range
          in: header
          schema:
            type: string
            maxLength: 1024
        - name: If-Range
          in: header
          schema:
            type: string
            maxLength: 256
      responses:
        "200":
          description: Same headers, no body
          headers:
            Content-Type:
              schema:
                type: string
                maxLength: 128
            Content-Length:
              schema:
                type: integer
                minimum: 0
                maximum: 9007199254740991
            ETag:
              schema:
                type: string
                maxLength: 256
            Accept-Ranges:
              schema:
                type: string
                enum:
                  - bytes
        "206":
          description: Single or multipart byte range
          headers:
            Content-Range:
              schema:
                type: string
                maxLength: 256
        "416":
          description: Unsatisfiable or malformed range; standard HTTP text permitted
          content:
            text/plain:
              schema:
                type: string
                maxLength: 4096
          headers:
            Content-Range:
              schema:
                type: string
                maxLength: 256
        default:
          $ref: "#/components/responses/Error"
      security:
        - streamToken: []
  /api/assets/{id}/content:
    get:
