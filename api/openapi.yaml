      x-requirements:
        - R08
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ID"
      responses:
        "200":
          description: Content
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
          headers:
            Content-Type:
              schema:
                type: string
                maxLength: 128
            Content-Length:
              schema:
                type: integer
                minimum: 0
                maximum: 9007199254740991
        default:
          $ref: "#/components/responses/Error"
    head:
      operationId: assetContentHead
      tags:
        - R08
      description: >-
        Only current valid bounded content, requires household session. No arbitrary URL proxy;
        cancellation is not negative cache.
      x-requirements:
        - R08
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ID"
      responses:
        "200":
          description: Same headers, no body
          headers:
            Content-Type:
              schema:
                type: string
                maxLength: 128
            Content-Length:
              schema:
                type: integer
                minimum: 0
                maximum: 9007199254740991
        default:
          $ref: "#/components/responses/Error"
  /api/media/{id}/subtitles/{subtitle}:
    get:
      operationId: subtitleContent
      tags:
