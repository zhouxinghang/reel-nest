# Optional: combine with compose.yaml and other metadata/media overrides.
# This connects to an existing MetaTube service; it does not deploy one.
services:
  reelnest:
    environment:
      METATUBE_URL: ${METATUBE_URL:?Set the MetaTube service base URL}
      METATUBE_TOKEN_FILE: /run/secrets/metatube_token
    secrets:
      - metatube_token
secrets:
  metatube_token:
    file: ./secrets/metatube_token.txt
